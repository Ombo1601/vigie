name: Vigie refresh

# The collector runs here, not on a laptop. GitHub Actions is the free scheduler
# and runner; Vercel stays the host. Cross-edition memory travels as one tarball
# in the PRIVATE Ombo1601/vigie-state repo (release asset), because the public
# repo must never carry publisher content.
#
# Required repository secrets:
#   VERCEL_TOKEN  Vercel token with access to the deemto team / vigie project
#   STATE_TOKEN   fine-grained PAT with contents:write on Ombo1601/vigie-state
#
# Note: GitHub disables scheduled workflows after ~60 days of repository
# inactivity; a normal commit restores them. Vercel's git auto-deploy is
# disabled in vercel.json, so this workflow is the only production writer.

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production (uncheck to validate the chain without Vercel)"
        type: boolean
        default: true
      simulate_failure:
        description: "Ops drill: force a failure to test the alert channel (never deploys)"
        type: boolean
        default: false

concurrency:
  group: vigie-refresh
  cancel-in-progress: false

permissions:
  contents: write   # the registre anchor commit (anchors/checkpoint.txt); nothing else is written
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_REPO: Ombo1601/vigie-state
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (vercel CLI + JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore cross-edition state
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          if gh release download state --repo "$STATE_REPO" \
               --pattern state.tar.gz --dir "$RUNNER_TEMP/state" --clobber; then
            python3 -X utf8 scripts/state_pack.py unpack "$RUNNER_TEMP/state/state.tar.gz"
          else
            echo "No state yet (first run) - starting a fresh memory."
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ops drill (optional)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Simulated failure requested to test the alert channel."
          exit 1

      - name: Refresh (collect -> verify -> stage -> deploy)
        run: |
          if [ "${{ inputs.deploy }}" = "false" ]; then
            python3 -X utf8 scripts/refresh.py --no-deploy
          else
            python3 -X utf8 scripts/refresh.py
          fi

      # Le Registre: after a successful deploy, the edition checkpoint (origin,
      # chain size, root — identifiers only, no publisher content) is committed
      # to the public repo. Git history becomes an independent, third-party
      # hosted ordering of the seals, and the commit doubles as the repository
      # activity that keeps the schedules alive. A push made with GITHUB_TOKEN
      # triggers no workflow and (vercel.json) no deployment.
      - name: Anchor the registre checkpoint in public git history
        if: success() && (github.event_name == 'schedule' || inputs.deploy)
        # A missed anchor is not a failed refresh: the edition is deployed and
        # the next run re-anchors the (changed) checkpoint. No false alarm.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f public/registre/checkpoint.txt ]; then
            echo "No checkpoint emitted; nothing to anchor."; exit 0
          fi
          mkdir -p anchors
          cp public/registre/checkpoint.txt anchors/checkpoint.txt
          if git diff --quiet -- anchors/checkpoint.txt && git ls-files --error-unmatch anchors/checkpoint.txt >/dev/null 2>&1; then
            echo "Checkpoint unchanged; no anchor commit."; exit 0
          fi
          git config user.name "vigie-registre"
          git config user.email "vigie-registre@users.noreply.github.com"
          git add anchors/checkpoint.txt
          seq="$(sed -n '2p' anchors/checkpoint.txt)"
          root="$(sed -n '3p' anchors/checkpoint.txt | cut -c1-12)"
          git commit -m "registre: seal ${seq} ${root}"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Persist cross-edition state
        if: always()
        run: |
          python3 -X utf8 scripts/state_pack.py pack "$RUNNER_TEMP/state/state.tar.gz"
          gh release view state --repo "$STATE_REPO" >/dev/null 2>&1 \
            || gh release create state --repo "$STATE_REPO" \
                 --title "Vigie state" \
                 --notes "Rolling snapshot of the cross-edition state (private; publisher content never enters the public repo)."
          gh release upload state "$RUNNER_TEMP/state/state.tar.gz" \
            --repo "$STATE_REPO" --clobber

      # Diagnosed silence on the deploy path: a failed run opens (or comments on)
      # a GitHub issue; the next successful run closes it. No external service.
      - name: Report failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          mode: failure

      - name: Close recovered alert
        if: success()
        uses: ./.github/actions/ops-alert
        with:
          mode: success
