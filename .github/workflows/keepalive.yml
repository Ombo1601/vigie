name: Keepalive

# GitHub disables *scheduled* workflows after ~60 days without repository
# activity. Vigie's refresh schedule must not sleep, so this monthly heartbeat
# makes one small commit; the push keeps every schedule alive. Vercel's git
# auto-deploy is disabled, so this commit cannot publish anything.

on:
  schedule:
    - cron: "23 4 1 * *"   # 1st of the month, 04:23 UTC
  workflow_dispatch: {}

concurrency:
  group: vigie-keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Heartbeat commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No heartbeat change; nothing to commit."
          else
            git commit -m "chore: keep scheduled workflows alive"
            git push
          fi
