name: Vigie roads refresh

# The real-time lane: the official WZDX obstructions update continuously, so this
# refreshes only that reading — it never runs normalize/enrich/cluster and never
# creates an edition, so "depuis la dernière édition", the dossier history and
# the edition metrics are untouched. If the declarations did not change, the
# render and deploy are skipped entirely (collection clocks are not a change).
#
# Shares the `vigie-refresh` concurrency group so it can never overlap a full
# refresh; both write production.

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07
  workflow_dispatch: {}

concurrency:
  group: vigie-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_REPO: Ombo1601/vigie-state
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (vercel CLI + JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore cross-edition state
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          if gh release download state --repo "$STATE_REPO" \
               --pattern state.tar.gz --dir "$RUNNER_TEMP/state" --clobber; then
            python3 -X utf8 scripts/state_pack.py unpack "$RUNNER_TEMP/state/state.tar.gz"
          else
            echo "No state yet (first run) - starting a fresh memory."
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Roads refresh (ingest WZDX -> anomalies/edges -> render -> deploy if changed)
        run: python3 -X utf8 scripts/refresh.py --roads-only

      - name: Persist cross-edition state
        if: always()
        run: |
          python3 -X utf8 scripts/state_pack.py pack "$RUNNER_TEMP/state/state.tar.gz"
          gh release view state --repo "$STATE_REPO" >/dev/null 2>&1 \
            || gh release create state --repo "$STATE_REPO" \
                 --title "Vigie state" \
                 --notes "Rolling snapshot of the cross-edition state (private; publisher content never enters the public repo)."
          gh release upload state "$RUNNER_TEMP/state/state.tar.gz" \
            --repo "$STATE_REPO" --clobber

      - name: Report failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          mode: failure

      - name: Close recovered alert
        if: success()
        uses: ./.github/actions/ops-alert
        with:
          mode: success
