name: Vigie roads refresh

# The real-time lane: the official WZDX obstructions update continuously, so this
# refreshes only that reading — it never runs normalize/enrich/cluster and never
# creates an edition, so "depuis la dernière édition", the dossier history and
# the edition metrics are untouched. If the declarations did not change, the
# render and deploy are skipped entirely (collection clocks are not a change).
#
# Shares the `vigie-refresh` concurrency group so it can never overlap a full
# refresh; both write production.

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07
  workflow_dispatch: {}

concurrency:
  group: vigie-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_REPO: Ombo1601/vigie-state
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (vercel CLI + JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fail closed, exactly as the full refresh (scripts/state_sync.py).
      - name: Restore cross-edition state
        id: restore
        run: python3 -X utf8 scripts/state_sync.py restore --repo "$STATE_REPO" --tag state --dir "$RUNNER_TEMP/state"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Roads refresh (ingest WZDX -> anomalies/edges -> render -> deploy if changed)
        run: python3 -X utf8 scripts/refresh.py --roads-only

      # The same refusals as the full refresh; the rolling asset only (dated
      # copies are the six-hourly refresh's job).
      - name: Persist cross-edition state
        if: always() && (steps.restore.outputs.outcome == 'restored' || steps.restore.outputs.outcome == 'fresh')
        env:
          VIGIE_STATE_ALLOW_SHRINK: ${{ vars.VIGIE_STATE_ALLOW_SHRINK }}
        run: python3 -X utf8 scripts/state_sync.py persist --repo "$STATE_REPO" --tag state --dir "$RUNNER_TEMP/state"

      - name: Report failure
        if: failure()
        uses: ./.github/actions/ops-alert
        with:
          mode: failure

      - name: Close recovered alert
        if: success()
        uses: ./.github/actions/ops-alert
        with:
          mode: success
