# Vigie — finite source chancellery (v0)
# Niche: Quebec City. Nest: city → province → linked world.
# Rule: every source is named. Cuts are logged. No single court owns the fog.
# Voice = institution (not RSS feed). Sister feeds share one institution_id.
# Last updated: 2026-09-17
# Owner: Onesphore Ombinos + co-founders

version: 1
niche:
  primary_geo: quebec-city
  nest: [quebec-city, quebec, linked]

# How to cut a source: set enabled: false, add cut_reason + cut_at, never delete history silently.
# source_kind: media | official — official = primary document / government / crown corp.
# institution: voice identity for silence map + fight gate (≥2 institutions).
# max_items: optional hard cap after fetch (RENT.md thin wallet).

sources:
  # --- Quebec City / Capitale-Nationale primary ---
  - id: radio-canada-quebec
    name: Radio-Canada — Québec
    institution: radio-canada
    institution_name: Radio-Canada
    language: fr
    geo: quebec-city
    nest_role: primary
    source_kind: media
    type: rss
    url: https://ici.radio-canada.ca/rss/6104
    homepage: https://ici.radio-canada.ca/info/quebec
    notes: Official regional RSS (id 6104). Verified HTTP 200.
    enabled: true
    license_note: Personal/non-commercial RSS use per Radio-Canada terms; contact them before commercial reuse.

  - id: journal-de-quebec
    name: Le Journal de Québec
    institution: journal-de-quebec
    institution_name: Le Journal de Québec
    language: fr
    geo: quebec-city
    nest_role: primary
    source_kind: media
    type: rss
    url: https://www.journaldequebec.com/rss.xml
    homepage: https://www.journaldequebec.com
    notes: Local tabloid/daily. Verified HTTP 200. Weight carefully — high volume, strong editorial voice.
    enabled: true
    license_note: Check publisher ToS before commercial redistribution.

  - id: le-soleil
